[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-espn"
version = "0.1.0"
description = "Python app interacting with the ESPN API to get fantasy football data."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
fantasy-espn = "fantasy_espn.cli:main"

[tool.setuptools.packages.find]
include = ["fantasy_espn*"]
